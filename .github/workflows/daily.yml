name: Be Greedy daily check

# Be Greedy closed in September 2026: the weekday schedule is gone, so nothing
# runs on its own any more. The manual trigger remains only to send the
# one-time goodbye email (tick "farewell").
on:
  workflow_dispatch:
    inputs:
      farewell:
        description: "Send the one-time goodbye email (a direct test to EMAIL_TO unless 'broadcast' is ticked)"
        type: boolean
        default: true
      force:
        description: "Send a test alert now, ignoring threshold/cooldown"
        type: boolean
        default: false
      broadcast:
        description: "Use the real Broadcast path (emails the whole Audience from your verified domain) instead of a direct test to EMAIL_TO"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-pulse
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Be Greedy
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # By default a run sends a direct test email to EMAIL_TO — use it to
          # preview the goodbye email in your own inbox. Tick "broadcast" to
          # send to the whole subscriber list from EMAIL_FROM (needs the
          # verified domain). The farewell broadcast only goes out once.
          RESEND_AUDIENCE_ID: ${{ inputs.broadcast && secrets.RESEND_AUDIENCE_ID || '' }}
          # Set the EMAIL_TO repo secret to your address to receive manual test
          # emails. (Kept as a secret, not hardcoded, so it's not public.)
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          FORCE: ${{ inputs.force }}
        run: python -m market_pulse.main ${{ inputs.farewell && '--farewell' || '' }}

      - name: Persist cooldown state
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update alert cooldown state [skip ci]"
            git push
          else
            echo "No state change — nothing to commit."
          fi

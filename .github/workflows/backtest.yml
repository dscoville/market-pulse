name: Backtest

# Replays the scoring + alert rules over decades of history and posts the
# results to the run's summary page. Runs on PRs that touch the engine, and on
# demand. Read-only: it never emails and never commits.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "market_pulse/**"
      - "tests/**"
      - ".github/workflows/backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Backtest since 1990
        run: python -m market_pulse.backtest --markdown "$GITHUB_STEP_SUMMARY"
